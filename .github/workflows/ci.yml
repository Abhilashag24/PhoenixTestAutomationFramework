name: Phoenix Test Automation Workflow
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '00 08 * * *'
    - cron: '45 08 * * *'
  workflow_dispatch: 
    inputs:
      env: 
        description: "Environment"
        type: choice
        options: [dev,qa,uat]
        default: qa
        required: true
      suiteXmlFile: 
        description: "TestNG xml file"
        type: choice
        options: [testng.xml,testng_datadriven.xml,smoke.xml,regression.xml]
        default: testng.xml
        required: true
jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Creating the .env file
      run: | 
              echo "DB_URL=${{ secrets.DB_URL }}" >> .env
              echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
              echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env


    - name: Execute Test Automation Framework
      run: mvn clean test -DsuiteXmlFile=${{ inputs.suiteXmlFile || 'testng.xml' }} -Denv=${{ inputs.env }}
      
    - name: Upload a Build Artifact
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: Surefire Report
        path: target/surefire-reports/
        retention-days: 10
        
